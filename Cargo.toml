[workspace]
members = [
    "crates/medha-core",
    "crates/medha-store",
    "crates/medha-sync",
    "crates/medha",
    "crates/medha-cli",
    "crates/medha-napi",
]
resolver = "2"

[workspace.package]
version = "0.8.0-alpha.1"
edition = "2021"
authors = ["Nimish Phalnikar <https://github.com/nimishph>"]
license = "MIT"
repository = "https://github.com/nimishph/medha"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ed25519-dalek = { version = "2.1", default-features = false, features = ["rand_core"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
hex = "0.4"
