name: Docs

# Publishes the documentation site to GitHub Pages.
#
# Deliberately separate from ci.yml: the site build needs Node and a VitePress install on top of the
# bun workspace, and there is no reason to pay that on every CI run, nor to risk a docs failure
# gating a release.

on:
  push:
    branches: [main, master]
    paths:
      - 'site/**'
      - 'cli/src/commands.ts'
      - 'cli/src/options.ts'
      - 'cli/package.json'
      - 'README.md'
      - 'SKILL.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'cli/src/commands.ts'
      - 'cli/src/options.ts'
      - 'cli/package.json'
      - 'README.md'
      - 'SKILL.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, and let a running one finish rather than cancelling mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `lastUpdated` reads git history for each page's date.
          fetch-depth: 0

      # bun is needed to run the CLI reference generator: it imports TypeScript sources that resolve
      # through the workspace, which node cannot do.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      # VitePress itself runs on node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci
        working-directory: site

      - name: Build
        run: npm run build
        working-directory: site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
