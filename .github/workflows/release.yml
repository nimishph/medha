name: Release

# Trigger on version tags (e.g. v0.1.0)
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-latest }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
          - { platform: darwin-arm64, runner: macos-latest }
          - { platform: win32-x64, runner: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'darwin-arm64' && 'x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun run smoke
      - name: Cross-compile darwin-x64 on macOS runner
        if: matrix.platform == 'darwin-arm64'
        run: bun run tooling/package-release.ts --rust --target darwin-x64
      - uses: actions/upload-artifact@v4
        with:
          name: medha-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.platform }}
          path: dist/npm/
          if-no-files-found: error

  release:
    name: Publish & Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify Tag Matches Manifest Version
        run: |
          version="$(node -p "require('./cli/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match cli/package.json version ${version}" >&2
            exit 1
          fi

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_CHANGELOG.md

      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: staged
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: medha-*
          path: archives
          merge-multiple: true

      # `actions/upload-artifact` stores files in a zip and does NOT carry POSIX permission bits
      # across the job boundary, so every program in `staged/` arrives 0644 no matter what the build
      # job chmod'd. Publishing that as-is is exactly the bug in nimishph/medha#1: the tarball
      # installs, and then `medha` fails with EACCES on every platform. Put the bit back, and check
      # it stuck, rather than shipping a package that cannot run.
      #
      # The release archives (dist/*.tar.gz) do not need this: they are tarballs built in the build
      # job, so their entries already carry the mode from `bun run build`.
      - name: Restore the executable bit
        run: |
          set -euo pipefail
          for dir in staged/*/; do
            mapfile -t programs < <(find "$dir/bin" -maxdepth 1 -type f)
            if [ "${#programs[@]}" -ne 1 ]; then
              echo "expected exactly one program in $dir/bin, found ${#programs[@]}" >&2
              exit 1
            fi
            program="${programs[0]}"
            chmod 0755 "$program"
            mode="$(stat -c '%a' "$program")"
            printf '%s  %s\n' "$mode" "$program"
            [ "$mode" = "755" ] || { echo "mode is $mode, expected 755" >&2; exit 1; }
          done

      # Platform packages go first so the launcher never points at a version that is not there yet.
      # A version that is already on the registry is skipped (so a re-run is safe); any other
      # failure stops the release. `npm stage publish` (npm 11+, hence node-version 24 above) defers
      # 2FA to the approval step below, so CI needs only an ordinary automation token here — no
      # bypass-2FA granular token.
      - name: Stage on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is not set: refusing to release without staging on npm" >&2
            exit 1
          fi
          stage() {
            dir="./${1#./}"
            name="$(node -p "require('${dir}/package.json').name")"
            version="$(node -p "require('${dir}/package.json').version")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published, skipping"
            else
              npm stage publish "${dir}" --access public --provenance --tag latest
            fi
          }
          for folder in staged/*/; do stage "${folder%/}"; done
          cp README.md LICENSE SKILL.md cli/
          stage ./cli

      - name: List what needs approval
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "::notice::Each package above is staged, not live yet. Run 'npm stage approve <id>' (with your own 2FA) for each, or 'npm stage list' to see them again later."
          npm stage list "@cntxt-labs/medha-cli" || true
          npm stage list "@cntxt-labs/medha-linux-x64" || true
          npm stage list "@cntxt-labs/medha-linux-arm64" || true
          npm stage list "@cntxt-labs/medha-darwin-arm64" || true
          npm stage list "@cntxt-labs/medha-darwin-x64" || true
          npm stage list "@cntxt-labs/medha-win32-x64" || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: medha ${{ github.ref_name }}
          body_path: RELEASE_CHANGELOG.md
          generate_release_notes: true
          files: |
            archives/*.zip
            archives/*.tar.gz
