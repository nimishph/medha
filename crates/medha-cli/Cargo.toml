[package]
name = "medha-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Native command-line interface and MCP server for Medha."

[lib]
name = "medha_cli"
path = "src/lib.rs"

[[bin]]
name = "medha"
path = "src/main.rs"

[dependencies]
medha = { path = "../medha", version = "0.8.0-alpha.2" }
medha-core = { path = "../medha-core", version = "0.8.0-alpha.2" }
medha-store = { path = "../medha-store", version = "0.8.0-alpha.2" }
medha-sync = { path = "../medha-sync", version = "0.8.0-alpha.2" }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3.17"
